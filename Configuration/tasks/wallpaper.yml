title: Wallpaper
actions:
 - !writeStatus {status: "Copying Files"}
 - !cmd: {exeDir: true, command: 'xcopy "Windows" "%windir%" /E /I /Y'}

 # Wallpaper
 - !writeStatus {status: "Applying Wallpaper"}
 - !powerShell: {command: '.\WALLPAPER.ps1 -Mode Desktop -ImagePath "$env:systemroot\Web\Wallpaper\Amethyst\amethyst.jpg"', exeDir: true, runas: currentUserElevated}
 - !powerShell: {command: '.\WALLPAPER.ps1 -Mode LockScreen -ImagePath "$env:systemroot\Web\Wallpaper\Amethyst\amethyst.jpg"', exeDir: true, runas: currentUserElevated}
