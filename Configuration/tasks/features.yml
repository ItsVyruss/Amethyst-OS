title: Features
actions:
  - !writeStatus: {status: 'Disabling Optional Features'}

  # Disable legacy SMB 1.0 support
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:SMB1Protocol /NoRestart'}

  # Disable the legacy Telnet client
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:TelnetClient /NoRestart'}

  # Disable the legacy TFTP client
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:TFTP /NoRestart'}

  # Disable legacy PowerShell 2.0
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:MicrosoftWindowsPowerShellV2Root /NoRestart'}
